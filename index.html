<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GYM PRO - 專業健身助手</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --primary: #cfff04; /* 運動螢光綠 */
            --secondary: #00f2ff; /* 科技藍 */
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --danger: #ff4444;
            --grad: linear-gradient(135deg, #cfff04 0%, #76ff03 100%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* 容器設計 - 不再限制於圓形 */
        #app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: radial-gradient(circle at top right, #1a2a00, #0a0a0a);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 20px;
        }

        #top-clock {
            font-family: monospace;
            font-size: 1rem;
            color: var(--primary);
            font-weight: bold;
        }

        .screen { 
            display: none; 
            flex-direction: column; 
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            font-size: 1.5rem; 
            margin: 0 0 20px 0; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        /* 按鈕設計 */
        button {
            background: var(--card-bg); 
            color: white; 
            border: 1px solid #333; 
            padding: 16px;
            border-radius: 16px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.98);
            background: #252525;
        }

        .btn-primary {
            background: var(--grad);
            color: #000;
            border: none;
            box-shadow: 0 4px 15px rgba(207, 255, 4, 0.3);
        }

        /* START 按鈕 */
        .start-btn-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--grad);
            color: #000;
            font-size: 2rem;
            font-weight: 900;
            border: 8px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(207, 255, 4, 0.4);
            cursor: pointer;
            transition: 0.3s;
        }

        /* 滾動區域 */
        .scroll-box { 
            flex: 1;
            overflow-y: auto; 
            padding-right: 5px;
        }
        .scroll-box::-webkit-scrollbar { width: 4px; }
        .scroll-box::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* 設定數值的卡片樣式 */
        .control-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
        }

        .stepper-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-top: 10px;
        }

        .step-btn { 
            width: 50px; 
            height: 50px; 
            border-radius: 15px; 
            font-size: 1.5rem; 
            background: #2a2a2a;
            border: none;
            margin: 0;
        }

        .step-label { 
            font-size: 2rem; 
            font-weight: 800;
            color: var(--primary);
        }
        .step-unit { font-size: 0.9rem; color: var(--text-dim); margin-left: 5px; }

        /* 訓練中顯示 */
        .display-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #val-sets { font-size: 8rem; font-weight: 900; line-height: 1; color: var(--primary); }
        #timer-display { font-size: 5rem; font-weight: 900; color: var(--secondary); }

        /* 歷史紀錄卡片 */
        .history-card {
            background: #151515;
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        .history-date { font-size: 0.75rem; color: var(--secondary); font-weight: bold; margin-bottom: 5px; display: block; }
        .history-content { font-size: 0.9rem; color: #eee; line-height: 1.4; }

        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <div style="font-weight: 900; letter-spacing: 1px;">GYM<span style="color:var(--primary)">PRO</span></div>
            <div id="top-clock">00:00:00</div>
        </header>

        <!-- 0. 啟動頁 -->
        <div id="step-0" class="screen active">
            <div class="start-btn-container">
                <button class="start-circle" onclick="showScreen('0-1')">GO</button>
            </div>
        </div>

        <!-- 0-1. 導覽頁 -->
        <div id="step-0-1" class="screen">
            <h2>健身助手</h2>
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                <button class="btn-primary" onclick="showScreen(1)">新訓練開始</button>
                <button onclick="viewAllHistory()">預覽歷史紀錄</button>
            </div>
        </div>

        <!-- 1. 類別選擇 -->
        <div id="step-1" class="screen">
            <h2>選擇類型</h2>
            <div class="scroll-box">
                <button onclick="enterCategory('DUMBBELL')">啞鈴訓練 (Dumbbell)</button>
                <button onclick="enterCategory('MACHINE')">機械器材 (Machine)</button>
                <button onclick="enterCategory('BARBELL')">槓鈴訓練 (Barbell)</button>
            </div>
            <a href="#" class="back-link" onclick="showScreen('0-1')">← 返回主選單</a>
        </div>

        <!-- 1-1. 動作清單 -->
        <div id="step-1-1" class="screen">
            <h2>選擇動作</h2>
            <div class="scroll-box">
                <button onclick="selectExercise('上斜啞鈴臥推')">上斜啞鈴臥推</button>
                <button onclick="selectExercise('平板啞鈴臥推')">平板啞鈴臥推</button>
                <button onclick="selectExercise('下斜啞鈴推舉')">下斜推舉</button>
                <button onclick="selectExercise('啞鈴飛鳥')">啞鈴飛鳥</button>
                <button onclick="selectExercise('窄距胸推')">窄距胸推</button>
            </div>
            <a href="#" class="back-link" onclick="showScreen(1)">← 返回類別</a>
        </div>

        <!-- 2. 設定 -->
        <div id="step-2" class="screen">
            <h2 id="display-ex">動作設定</h2>
            <div class="scroll-box">
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">訓練重量</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('weight', -2)">−</button>
                        <div class="step-label"><span id="val-weight">20</span><span class="step-unit">KG</span></div>
                        <button class="step-btn" onclick="changeVal('weight', 2)">+</button>
                    </div>
                </div>
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">每組下數</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('reps', -1)">−</button>
                        <div class="step-label"><span id="val-reps">10</span><span class="step-unit">REPS</span></div>
                        <button class="step-btn" onclick="changeVal('reps', 1)">+</button>
                    </div>
                </div>
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">目標組數</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('targetSets', -1)">−</button>
                        <div class="step-label"><span id="val-targetSets">3</span><span class="step-unit">SETS</span></div>
                        <button class="step-btn" onclick="changeVal('targetSets', 1)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-primary" onclick="startCurrentExercise()">開始訓練</button>
        </div>

        <!-- 3. 訓練進行中 -->
        <div id="step-3" class="screen">
            <div class="display-main">
                <div style="color:var(--text-dim); font-size: 1.2rem; font-weight: bold;">SET</div>
                <div id="val-sets">1</div>
                <div style="font-size: 1.2rem; margin-top: 10px; font-weight: bold;">OF <span id="val-target-total">3</span></div>
            </div>
            <button class="btn-primary" style="padding: 25px; font-size: 1.2rem;" onclick="handleFinishSet()">完成此組</button>
            <button style="border:none; color:var(--danger); background:none;" onclick="showAfterExercise()">提早結束此動作</button>
        </div>

        <!-- 4. 休息 -->
        <div id="step-4" class="screen">
            <div class="display-main">
                <div style="color:var(--secondary); font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;">RESTING...</div>
                <div id="timer-display">01:00</div>
            </div>
            <button class="btn-primary" onclick="skipRest()">跳過休息</button>
        </div>

        <!-- 5. 單項總結 -->
        <div id="step-5" class="screen">
            <h2 id="congrats-title" style="color:var(--primary)">SUCCESS!</h2>
            <div class="display-main">
                <div style="font-size: 1.2rem; color:var(--text-dim)">您已完成了</div>
                <div style="font-size: 4rem; font-weight: 900;"><span id="summary-sets">0</span></div>
                <div style="font-size: 1.2rem; font-weight: bold;">組訓練</div>
            </div>
            <button class="btn-primary" onclick="showScreen(1)">訓練下一項動作</button>
            <button onclick="finalSettlement()">結束本次訓練並結算</button>
        </div>

        <!-- 6. 今日結算 -->
        <div id="step-6" class="screen">
            <h2>訓練結算</h2>
            <div class="scroll-box" id="history-list"></div>
            <button class="btn-primary" onclick="saveAndExit()" style="margin-top: 20px;">儲存紀錄並離開</button>
        </div>

        <!-- 7. 全歷史預覽 -->
        <div id="step-7" class="screen">
            <h2>歷史紀錄</h2>
            <div class="scroll-box" id="all-history-list"></div>
            <a href="#" class="back-link" onclick="showScreen('0-1')">← 返回主選單</a>
            <button onclick="clearHistory()" style="margin-top: 20px; color: var(--danger); font-size: 0.8rem; background: none; border:none;">清除所有本地紀錄</button>
        </div>
    </div>

    <script>
        // 核心狀態
        let session = {
            start: null,
            history: [],
            curr: { name: '', weight: 20, reps: 10, target: 3, actualCount: 0, rest: 60 },
            timer: null
        };

        // 更新時鐘
        function updateTime() {
            const now = new Date();
            document.getElementById('top-clock').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 畫面切換
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + id).classList.add('active');
        }

        // 選擇類型
        function enterCategory(cat) {
            if (cat === 'DUMBBELL') showScreen('1-1');
            else selectExercise(cat === 'MACHINE' ? '機械器材' : '槓鈴訓練');
        }

        // 選擇動作
        function selectExercise(name) {
            session.curr.name = name;
            session.curr.actualCount = 0;
            document.getElementById('display-ex').innerText = name;
            showScreen(2);
        }

        // 調整參數
        function changeVal(key, delta) {
            if (key === 'targetSets') {
                session.curr.target = Math.max(1, session.curr.target + delta);
                document.getElementById('val-targetSets').innerText = session.curr.target;
            } else if (key === 'reps') {
                session.curr.reps = Math.max(1, session.curr.reps + delta);
                document.getElementById('val-reps').innerText = session.curr.reps;
            } else if (key === 'weight') {
                session.curr.weight = Math.max(0, session.curr.weight + delta);
                document.getElementById('val-weight').innerText = session.curr.weight;
            }
        }

        // 開始訓練
        function startCurrentExercise() {
            if (!session.start) session.start = new Date();
            document.getElementById('val-sets').innerText = 1;
            document.getElementById('val-target-total').innerText = session.curr.target;
            showScreen(3);
        }

        // 完成本組
        function handleFinishSet() {
            session.curr.actualCount++;
            if (session.curr.actualCount >= session.curr.target) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                document.getElementById('congrats-title').innerText = "GOAL REACHED!";
                showAfterExercise();
            } else {
                document.getElementById('val-sets').innerText = session.curr.actualCount + 1;
                if (navigator.vibrate) navigator.vibrate(60);
                showScreen(4);
                startRestTimer();
            }
        }

        // 休息計時
        function startRestTimer() {
            let t = session.curr.rest;
            const el = document.getElementById('timer-display');
            const fmt = (s) => {
                el.innerText = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            };
            fmt(t);
            clearInterval(session.timer);
            session.timer = setInterval(() => {
                t--; fmt(t);
                if (t <= 0) {
                    clearInterval(session.timer);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    showScreen(3);
                }
            }, 1000);
        }

        function skipRest() { clearInterval(session.timer); showScreen(3); }

        function showAfterExercise() {
            if(session.curr.actualCount > 0) {
                session.history.push({
                    name: session.curr.name,
                    weight: session.curr.weight,
                    reps: session.curr.reps,
                    sets: session.curr.actualCount
                });
            }
            document.getElementById('summary-sets').innerText = session.curr.actualCount;
            showScreen(5);
        }

        // 結算畫面
        function finalSettlement() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            session.history.forEach(item => {
                const d = document.createElement('div');
                d.className = 'history-card';
                d.innerHTML = `
                    <div style="font-weight:bold; margin-bottom:5px;">${item.name}</div>
                    <div style="font-size:0.8rem; color:var(--text-dim);">${item.weight}KG x ${item.reps}REPS x ${item.sets}SETS</div>
                `;
                list.appendChild(d);
            });
            showScreen(6);
        }

        // 儲存並離開
        function saveAndExit() {
            const savedData = JSON.parse(localStorage.getItem('gym_records_pro') || '[]');
            const record = {
                date: new Date().toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                exercises: session.history
            };
            savedData.unshift(record);
            localStorage.setItem('gym_records_pro', JSON.stringify(savedData));
            
            // 重置
            session.history = [];
            session.start = null;
            showScreen('0');
        }

        // 查看歷史
        function viewAllHistory() {
            const list = document.getElementById('all-history-list');
            list.innerHTML = '';
            const savedData = JSON.parse(localStorage.getItem('gym_records_pro') || '[]');
            
            if(savedData.length === 0) {
                list.innerHTML = '<div style="margin-top:40px; color:#444; font-weight:bold; text-align:center;">NO RECORDS FOUND</div>';
            } else {
                savedData.forEach(day => {
                    const d = document.createElement('div');
                    d.className = 'history-card';
                    let exSummary = day.exercises.map(e => `${e.name}(${e.sets}組)`).join(' · ');
                    d.innerHTML = `
                        <span class="history-date">${day.date}</span>
                        <div class="history-content">${exSummary}</div>
                    `;
                    list.appendChild(d);
                });
            }
            showScreen(7);
        }

        function clearHistory() {
            if(confirm("確定要刪除所有歷史運動紀錄嗎？這無法復原。")) {
                localStorage.removeItem('gym_records_pro');
                viewAllHistory();
            }
        }
    </script>
</body>
</html>
