<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Watch Ultimate Pro</title>
    <style>
        :root {
            --bg-color: #000;
            --primary-color: #00f2ff;
            --accent-color: #39ff14;
            --text-color: #fff;
            --card-bg: #111;
        }

        body { 
            background-color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 模擬手錶圓形外框 */
        #watch-frame {
            width: 320px; 
            height: 320px; 
            background-color: var(--bg-color); 
            border-radius: 50%;
            border: 8px solid #444; 
            position: relative; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: var(--text-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 頂部時間 */
        #top-clock { 
            position: absolute; 
            top: 35px; 
            font-size: 0.75rem; 
            color: #888; 
            font-variant-numeric: tabular-nums;
        }

        /* 螢幕切換基礎 */
        .screen { 
            display: none; 
            width: 85%; 
            flex-direction: column; 
            gap: 4px; 
            margin-top: 15px; 
            align-items: center; 
            text-align: center;
        }
        .screen.active { display: flex; }

        h2 { 
            font-size: 0.9rem; 
            margin: 0 0 5px 0; 
            color: var(--primary-color); 
            letter-spacing: 1px;
        }

        /* 按鈕樣式 */
        button {
            background: #222; 
            color: white; 
            border: 1px solid #333; 
            padding: 8px;
            border-radius: 20px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 0.8rem;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { background: #444; }

        .action-btn { 
            background: var(--primary-color); 
            color: black; 
            font-weight: bold; 
            border: none; 
            padding: 10px;
            margin-top: 5px;
        }
        .action-btn:active { background: #00c8d4; }

        /* 滑動清單樣式 */
        .scroll-box { 
            max-height: 140px; 
            overflow-y: auto; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            padding: 5px; 
        }
        .scroll-box::-webkit-scrollbar { width: 0; }

        /* 參數調整列樣式 */
        .stepper-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 95%; 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 2px 8px; 
            margin-bottom: 2px;
        }
        .step-btn { 
            width: 35px; 
            height: 28px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 1.2rem; 
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
        }
        .step-label { 
            font-size: 0.75rem; 
            width: 95px; 
            text-align: center; 
            font-weight: 500;
        }
        .unit { font-size: 0.6rem; color: #888; margin-left: 2px; }

        /* 訓練中大數字 */
        #val-sets { font-size: 4.5rem; font-weight: bold; line-height: 1; color: #fff; }
        #timer-display { font-size: 3.5rem; font-weight: bold; color: var(--accent-color); line-height: 1; }

        /* 結算清單項目 */
        .log-item { 
            font-size: 0.7rem; 
            border-bottom: 1px solid #222; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 0; 
            text-align: left;
        }
        .log-item span:last-child { color: #aaa; text-align: right; }
    </style>
</head>
<body>

    <div id="watch-frame">
        <div id="top-clock">00:00:00</div>

        <!-- 1. 主選單：選擇訓練類型 -->
        <div id="step-1" class="screen active">
            <h2>選擇類型</h2>
            <button onclick="enterCategory('DUMBBELL')">啞鈴項目</button>
            <button onclick="enterCategory('MACHINE')">機械器材</button>
            <button onclick="enterCategory('BARBELL')">槓鈴項目</button>
        </div>

        <!-- 1.1 啞鈴子選單 -->
        <div id="step-1-1" class="screen">
            <h2>啞鈴動作</h2>
            <div class="scroll-box">
                <button onclick="selectExercise('上斜啞鈴臥推')">上斜臥推</button>
                <button onclick="selectExercise('平板啞鈴臥推')">平板臥推</button>
                <button onclick="selectExercise('下斜啞鈴推舉')">下斜推舉</button>
                <button onclick="selectExercise('啞鈴飛鳥')">啞鈴飛鳥</button>
                <button onclick="selectExercise('窄距胸推')">窄距胸推</button>
                <button onclick="showScreen(1)" style="color: #888; margin-top: 5px;">← 返回</button>
            </div>
        </div>

        <!-- 2. 參數設定：重量、下數、組數、休息 -->
        <div id="step-2" class="screen">
            <h2 id="display-ex">動作名稱</h2>
            <div class="stepper-row">
                <button class="step-btn" onclick="changeVal('weight', -2)">−</button>
                <div class="step-label"><span id="val-weight">20</span><span class="unit">kg</span></div>
                <button class="step-btn" onclick="changeVal('weight', 2)">+</button>
            </div>
            <div class="stepper-row">
                <button class="step-btn" onclick="changeVal('reps', -1)">−</button>
                <div class="step-label"><span id="val-reps">10</span><span class="unit">下/組</span></div>
                <button class="step-btn" onclick="changeVal('reps', 1)">+</button>
            </div>
            <div class="stepper-row">
                <button class="step-btn" onclick="changeVal('targetSets', -1)">−</button>
                <div class="step-label">目標 <span id="val-targetSets">3</span><span class="unit">組</span></div>
                <button class="step-btn" onclick="changeVal('targetSets', 1)">+</button>
            </div>
            <div class="stepper-row" style="background:none;">
                <button class="step-btn" onclick="changeVal('rest', -60)" style="background:#222">−</button>
                <div class="step-label" style="font-size:0.65rem">休息 <span id="val-rest">1</span>m</div>
                <button class="step-btn" onclick="changeVal('rest', 60)" style="background:#222">+</button>
            </div>
            <button class="action-btn" onclick="startCurrentExercise()">開始訓練</button>
        </div>

        <!-- 3. 訓練進行中 (顯示當前組數) -->
        <div id="step-3" class="screen">
            <div id="val-sets">1</div>
            <div style="font-size: 0.8rem; margin-bottom: 10px;">/ <span id="val-target-total">3</span> 組 (進行中)</div>
            <button class="action-btn" onclick="handleFinishSet()">完成本組</button>
            <button style="border:none; background:none; color:#666; font-size:0.7rem; margin-top:8px;" onclick="showAfterExercise()">提早結束</button>
        </div>

        <!-- 4. 休息倒數 -->
        <div id="step-4" class="screen">
            <h2 style="color: var(--accent-color)">休息中</h2>
            <div id="timer-display">01:00</div>
            <button onclick="skipRest()" style="font-size: 0.7rem; width: 50%; margin-top: 10px;">跳過</button>
        </div>

        <!-- 5. 本項完成/詢問是否繼續 -->
        <div id="step-5" class="screen">
            <h2 id="congrats-title">此項完成</h2>
            <div style="font-size: 0.85rem; margin-bottom: 15px;">總計完成 <span id="summary-sets" style="color:var(--accent-color)">0</span> 組</div>
            <button class="action-btn" onclick="showScreen(1)">繼續下一項訓練</button>
            <button onclick="finalSettlement()" style="margin-top:8px; border:none; background:#222; color:#aaa;">結束總結</button>
        </div>

        <!-- 6. 最終統計報告 -->
        <div id="step-6" class="screen">
            <h2 style="color: gold;">今日訓練成果</h2>
            <div class="scroll-box" id="history-list">
                <!-- 動態插入 -->
            </div>
            <div style="font-size: 0.75rem; color: #888; margin-top: 5px; text-align: center; width: 100%;">
                總計: <span id="total-sets-final" style="color:#fff">0</span> 組 | 耗時: <span id="total-time-final" style="color:#fff">0</span>
            </div>
            <button class="action-btn" onclick="location.reload()" style="margin-top: 10px;">儲存紀錄並離開</button>
        </div>
    </div>

    <script>
        // 核心狀態管理
        let session = {
            start: null,
            history: [],
            curr: { 
                name: '', 
                weight: 20, 
                reps: 10, 
                target: 3, 
                actualCount: 0, 
                rest: 60 
            },
            timer: null
        };

        // 提醒聲響 (Web Audio API)
        function playAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                g.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) { console.log("Audio API not supported"); }
        }

        // 更新頂部電子鐘
        function updateTime() {
            const now = new Date();
            document.getElementById('top-clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 畫面切換控制
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + id).classList.add('active');
        }

        // 選擇主類別
        function enterCategory(cat) {
            if (cat === 'DUMBBELL') {
                showScreen('1-1');
            } else {
                selectExercise(cat === 'MACHINE' ? '機械器材' : '槓鈴器材');
            }
        }

        // 選擇具體動作
        function selectExercise(name) {
            session.curr.name = name;
            session.curr.actualCount = 0; // 重置計數
            document.getElementById('display-ex').innerText = name;
            showScreen(2);
        }

        // 增減參數數值
        function changeVal(key, delta) {
            if (key === 'rest') {
                session.curr.rest = Math.max(60, session.curr.rest + delta);
                document.getElementById('val-rest').innerText = session.curr.rest / 60;
            } else if (key === 'targetSets') {
                session.curr.target = Math.max(1, session.curr.target + delta);
                document.getElementById('val-targetSets').innerText = session.curr.target;
            } else if (key === 'reps') {
                session.curr.reps = Math.max(1, session.curr.reps + delta);
                document.getElementById('val-reps').innerText = session.curr.reps;
            } else if (key === 'weight') {
                session.curr.weight = Math.max(0, session.curr.weight + delta);
                document.getElementById('val-weight').innerText = session.curr.weight;
            }
        }

        // 開始當前項目訓練
        function startCurrentExercise() {
            if (!session.start) session.start = new Date(); // 第一次開始才計時
            document.getElementById('val-sets').innerText = 1;
            document.getElementById('val-target-total').innerText = session.curr.target;
            showScreen(3);
        }

        // 處理「完成本組」按鈕點擊
        function handleFinishSet() {
            session.curr.actualCount++;
            
            // 邏輯判定：是否已達目標組數
            if (session.curr.actualCount >= session.curr.target) {
                // 1. 目標達成：發出特殊震動並跳轉
                if (navigator.vibrate) navigator.vibrate([150, 100, 150]);
                playAlert();
                document.getElementById('congrats-title').innerText = "目標達成！";
                showAfterExercise();
            } else {
                // 2. 尚未達成：進入休息倒數
                document.getElementById('val-sets').innerText = session.curr.actualCount + 1;
                if (navigator.vibrate) navigator.vibrate(80);
                showScreen(4);
                startRestTimer();
            }
        }

        // 休息倒數計時器
        function startRestTimer() {
            let t = session.curr.rest;
            const el = document.getElementById('timer-display');
            
            const fmt = (s) => {
                let mins = Math.floor(s/60).toString().padStart(2,'0');
                let secs = (s%60).toString().padStart(2,'0');
                el.innerText = `${mins}:${secs}`;
            };

            fmt(t);
            clearInterval(session.timer);
            session.timer = setInterval(() => {
                t--;
                fmt(t);
                if (t <= 0) {
                    clearInterval(session.timer);
                    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
                    playAlert();
                    showScreen(3); // 回到訓練畫面做下一組
                }
            }, 1000);
        }

        // 跳過休息
        function skipRest() {
            clearInterval(session.timer);
            showScreen(3);
        }

        // 顯示該項目的中間數據
        function showAfterExercise() {
            // 將此動作數據存入歷史紀錄
            if(session.curr.actualCount > 0) {
                session.history.push({
                    name: session.curr.name,
                    weight: session.curr.weight,
                    reps: session.curr.reps,
                    sets: session.curr.actualCount
                });
            }
            document.getElementById('summary-sets').innerText = session.curr.actualCount;
            showScreen(5);
        }

        // 總結算統計
        function finalSettlement() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            let totalSets = 0;

            session.history.forEach(item => {
                totalSets += item.sets;
                const d = document.createElement('div');
                d.className = 'log-item';
                d.innerHTML = `
                    <span>${item.name}</span>
                    <span>${item.weight}kg · ${item.reps}下 · ${item.sets}組</span>
                `;
                list.appendChild(d);
            });

            // 計算訓練總耗時
            const diff = Math.floor((new Date() - session.start) / 1000);
            const m = Math.floor(diff/60);
            const s = diff%60;

            document.getElementById('total-sets-final').innerText = totalSets;
            document.getElementById('total-time-final').innerText = `${m}分${s}秒`;
            
            showScreen(6);
        }
    </script>
</body>
</html>
