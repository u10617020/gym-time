<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健身 KO 榜單 - 專業運動挑戰</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --primary: #ff3e3e; /* 戰鬥紅 */
            --secondary: #ffb800; /* 金牌黃 */
            --accent: #00f2ff;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --danger: #ff4444;
            --grad: linear-gradient(135deg, #ff3e3e 0%, #ff8e00 100%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: radial-gradient(circle at top right, #2a0000, #0a0a0a);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 10px;
        }

        #top-clock {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        .screen { 
            display: none; 
            flex-direction: column; 
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 { 
            font-size: 1.5rem; 
            margin: 0 0 15px 0; 
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
        }

        /* 輸入框 */
        input {
            background: #222;
            border: 2px solid #444;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            width: 100%;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        /* 按鈕設計 */
        button {
            background: var(--card-bg); 
            color: white; 
            border: 1px solid #333; 
            padding: 16px;
            border-radius: 16px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active { transform: scale(0.98); }

        .btn-primary {
            background: var(--grad);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 62, 62, 0.4);
            text-transform: uppercase;
            font-weight: 900;
        }

        /* 滾動區域 */
        .scroll-box { 
            flex: 1;
            overflow-y: auto; 
            padding-right: 5px;
        }
        .scroll-box::-webkit-scrollbar { width: 0; }

        /* 排行榜卡片 */
        .leaderboard-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .rank-label { color: var(--text-dim); font-size: 0.8rem; }
        .rank-value { color: var(--secondary); font-weight: bold; }

        /* 設定卡片 */
        .control-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
        }

        .stepper-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }

        .step-btn { 
            width: 45px; height: 45px; border-radius: 12px; font-size: 1.5rem; 
            background: #333; border: none; margin: 0;
        }

        .step-label { font-size: 1.8rem; font-weight: 800; color: var(--primary); }

        /* 歷史紀錄卡片 */
        .history-card {
            background: #151515;
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 0 10px 10px 0;
        }
        .player-tag {
            background: var(--primary);
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            text-transform: uppercase;
        }

        .search-container {
            margin-bottom: 15px;
        }
        .search-input {
            padding: 10px;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <div style="font-weight: 900; font-style: italic;">健身 <span style="color:var(--primary)">KO</span> 榜單</div>
            <div id="top-clock">00:00:00</div>
        </header>

        <!-- 0. 啟動頁 -->
        <div id="step-0" class="screen active">
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <h1 style="font-size: 3rem; font-style: italic; margin-bottom: 0;">KO!</h1>
                <p style="color:var(--text-dim); margin-bottom: 40px;">超越昨天的自己</p>
                <button class="btn-primary" style="width:150px; height:150px; border-radius:50%; font-size:2rem;" onclick="showMain()">GO</button>
            </div>
        </div>

        <!-- 0-1. 主導覽頁 & 排行榜 -->
        <div id="step-0-1" class="screen">
            <h2>英雄榜單</h2>
            <div class="leaderboard-container">
                <div class="rank-item">
                    <span class="rank-label">最高重量 (Max KG)</span>
                    <span class="rank-value" id="rank-weight">-</span>
                </div>
                <div class="rank-item">
                    <span class="rank-label">最多組數 (Max Sets)</span>
                    <span class="rank-value" id="rank-sets">-</span>
                </div>
                <div class="rank-item">
                    <span class="rank-label">總次數 (Total Reps)</span>
                    <span class="rank-value" id="rank-reps">-</span>
                </div>
                <div class="rank-item">
                    <span class="rank-label">最強意志 (Min Rest)</span>
                    <span class="rank-value" id="rank-rest">-</span>
                </div>
            </div>
            <button class="btn-primary" onclick="showScreen('name-input')">開始新的挑戰</button>
            <button onclick="viewAllHistory()">查看所有戰績</button>
        </div>

        <!-- 名稱輸入頁 -->
        <div id="step-name-input" class="screen">
            <h2>誰在挑戰？</h2>
            <p style="color:var(--text-dim); font-size: 0.8rem;">輸入玩家名稱以進入榜單</p>
            <input type="text" id="player-name" placeholder="例如: 巨石強森" maxlength="10">
            <button class="btn-primary" onclick="confirmPlayerName()">確定進入</button>
            <button style="background:none; border:none; color:#666;" onclick="showMain()">取消</button>
        </div>

        <!-- 1. 類別選擇 -->
        <div id="step-1" class="screen">
            <h2 id="welcome-player">選擇項目</h2>
            <div class="scroll-box">
                <button onclick="enterCategory('DUMBBELL')">啞鈴項目 (Dumbbell)</button>
                <button onclick="enterCategory('MACHINE')">機械器材 (Machine)</button>
                <button onclick="enterCategory('BARBELL')">槓鈴項目 (Barbell)</button>
            </div>
            <button style="background:none; border:none; color:#666;" onclick="showScreen('name-input')">← 更改玩家</button>
        </div>

        <!-- 1-1. 動作選擇 -->
        <div id="step-1-1" class="screen">
            <h2>選擇動作</h2>
            <div class="scroll-box">
                <button onclick="selectExercise('上斜臥推')">上斜臥推</button>
                <button onclick="selectExercise('平板臥推')">平板臥推</button>
                <button onclick="selectExercise('深蹲')">深蹲 (Squat)</button>
                <button onclick="selectExercise('硬舉')">硬舉 (Deadlift)</button>
                <button onclick="selectExercise('引體向上')">引體向上</button>
            </div>
            <button style="background:none; border:none; color:#666;" onclick="showScreen(1)">← 返回</button>
        </div>

        <!-- 2. 設定 -->
        <div id="step-2" class="screen">
            <h2 id="display-ex">動作設定</h2>
            <div class="scroll-box">
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">挑戰重量 (KG)</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('weight', -2.5)">−</button>
                        <div class="step-label" id="val-weight">20</div>
                        <button class="step-btn" onclick="changeVal('weight', 2.5)">+</button>
                    </div>
                </div>
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">每組下數</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('reps', -1)">−</button>
                        <div class="step-label" id="val-reps">10</div>
                        <button class="step-btn" onclick="changeVal('reps', 1)">+</button>
                    </div>
                </div>
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">目標組數</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('targetSets', -1)">−</button>
                        <div class="step-label" id="val-targetSets">3</div>
                        <button class="step-btn" onclick="changeVal('targetSets', 1)">+</button>
                    </div>
                </div>
                <div class="control-card">
                    <div style="color:var(--text-dim); font-size:0.8rem;">休息時間 (秒)</div>
                    <div class="stepper-row">
                        <button class="step-btn" onclick="changeVal('rest', -10)">−</button>
                        <div class="step-label" id="val-rest">60</div>
                        <button class="step-btn" onclick="changeVal('rest', 10)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-primary" onclick="startCurrentExercise()">開始 KO 挑戰</button>
        </div>

        <!-- 3. 進行中 -->
        <div id="step-3" class="screen">
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <div style="color:var(--text-dim); font-weight:bold;">SET</div>
                <div id="val-sets" style="font-size: 8rem; font-weight: 900; color: var(--primary);">1</div>
                <div style="font-size: 1.2rem; font-weight: bold;">OF <span id="val-target-total">3</span></div>
            </div>
            <button class="btn-primary" style="padding: 25px;" onclick="handleFinishSet()">完成此組</button>
        </div>

        <!-- 4. 休息 -->
        <div id="step-4" class="screen">
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <div style="color:var(--accent); font-weight:bold; margin-bottom: 20px;">RESTING...</div>
                <div id="timer-display" style="font-size: 5rem; font-weight: 900;">01:00</div>
            </div>
            <button class="btn-primary" onclick="skipRest()">跳過休息</button>
        </div>

        <!-- 5. 結算 -->
        <div id="step-5" class="screen">
            <h2 style="color:var(--secondary)">KO SUCCESS!</h2>
            <div id="history-list" class="scroll-box"></div>
            <button class="btn-primary" onclick="saveAndExit()">儲存戰績並結束</button>
            <button onclick="showScreen(1)">繼續下一項挑戰</button>
        </div>

        <!-- 7. 全歷史預覽 -->
        <div id="step-7" class="screen">
            <h2>所有戰績回顧</h2>
            <div class="search-container">
                <input type="text" id="search-name" class="search-input" placeholder="搜尋玩家名稱..." oninput="viewAllHistory()">
            </div>
            <div class="scroll-box" id="all-history-list"></div>
            <button style="background:none; border:none; color:#666;" onclick="showMain()">← 返回主頁</button>
            <button onclick="clearHistory()" style="color: var(--danger); font-size: 0.7rem; border:none; background:none;">清除本地數據</button>
        </div>
    </div>

    <script>
        let session = {
            playerName: '匿名玩家',
            history: [],
            curr: { name: '', weight: 20, reps: 10, target: 3, actualCount: 0, rest: 60 },
            timer: null
        };

        function updateTime() {
            document.getElementById('top-clock').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false });
        }
        setInterval(updateTime, 1000);
        updateTime();

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + id).classList.add('active');
        }

        function showMain() {
            updateLeaderboard();
            showScreen('0-1');
        }

        function confirmPlayerName() {
            const name = document.getElementById('player-name').value.trim();
            if(!name) { alert("請輸入英雄名稱！"); return; }
            session.playerName = name;
            document.getElementById('welcome-player').innerText = "挑戰者: " + name;
            showScreen(1);
        }

        function enterCategory(cat) {
            if (cat === 'DUMBBELL') showScreen('1-1');
            else selectExercise(cat === 'MACHINE' ? '機械器材' : '槓鈴訓練');
        }

        function selectExercise(name) {
            session.curr.name = name;
            session.curr.actualCount = 0;
            document.getElementById('display-ex').innerText = name;
            showScreen(2);
        }

        function changeVal(key, delta) {
            if (key === 'rest') {
                session.curr.rest = Math.max(0, session.curr.rest + delta);
                document.getElementById('val-rest').innerText = session.curr.rest;
            } else if (key === 'targetSets') {
                session.curr.target = Math.max(1, session.curr.target + delta);
                document.getElementById('val-targetSets').innerText = session.curr.target;
            } else if (key === 'reps') {
                session.curr.reps = Math.max(1, session.curr.reps + delta);
                document.getElementById('val-reps').innerText = session.curr.reps;
            } else if (key === 'weight') {
                session.curr.weight = Math.max(0, session.curr.weight + delta);
                document.getElementById('val-weight').innerText = session.curr.weight;
            }
        }

        function startCurrentExercise() {
            document.getElementById('val-sets').innerText = 1;
            document.getElementById('val-target-total').innerText = session.curr.target;
            showScreen(3);
        }

        function handleFinishSet() {
            session.curr.actualCount++;
            if (session.curr.actualCount >= session.curr.target) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                finishExercise();
            } else {
                document.getElementById('val-sets').innerText = session.curr.actualCount + 1;
                showScreen(4);
                startRestTimer();
            }
        }

        function startRestTimer() {
            let t = session.curr.rest;
            const el = document.getElementById('timer-display');
            const fmt = (s) => el.innerText = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            fmt(t);
            clearInterval(session.timer);
            session.timer = setInterval(() => {
                t--; fmt(t);
                if (t <= 0) { clearInterval(session.timer); showScreen(3); }
            }, 1000);
        }

        function skipRest() { clearInterval(session.timer); showScreen(3); }

        function finishExercise() {
            session.history.push({
                player: session.playerName,
                name: session.curr.name,
                weight: session.curr.weight,
                reps: session.curr.reps,
                sets: session.curr.actualCount,
                rest: session.curr.rest,
                time: new Date().toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            });
            renderHistoryList();
            showScreen(5);
        }

        function renderHistoryList() {
            const list = document.getElementById('history-list');
            list.innerHTML = session.history.map(item => `
                <div class="history-card">
                    <div style="font-weight:bold">${item.name}</div>
                    <div style="font-size:0.8rem; color:var(--text-dim)">${item.weight}KG x ${item.reps}下 x ${item.sets}組 (休${item.rest}s)</div>
                </div>
            `).join('');
        }

        function saveAndExit() {
            const allRecords = JSON.parse(localStorage.getItem('gym_ko_records') || '[]');
            allRecords.unshift(...session.history);
            localStorage.setItem('gym_ko_records', JSON.stringify(allRecords));
            session.history = [];
            showMain();
        }

        function viewAllHistory() {
            const search = document.getElementById('search-name').value.toLowerCase();
            const list = document.getElementById('all-history-list');
            const allRecords = JSON.parse(localStorage.getItem('gym_ko_records') || '[]');
            
            const filtered = allRecords.filter(r => r.player.toLowerCase().includes(search));
            
            if(filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:40px; color:#444;">無匹配紀錄</div>';
            } else {
                list.innerHTML = filtered.map(item => `
                    <div class="history-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span><span class="player-tag">${item.player}</span> <b>${item.name}</b></span>
                            <span style="font-size:0.6rem; color:#666;">${item.time}</span>
                        </div>
                        <div style="font-size:0.8rem; color:var(--text-dim)">${item.weight}KG x ${item.reps}下 x ${item.sets}組</div>
                    </div>
                `).join('');
            }
            showScreen(7);
        }

        function updateLeaderboard() {
            const allRecords = JSON.parse(localStorage.getItem('gym_ko_records') || '[]');
            if(allRecords.length === 0) return;

            let maxW = { val: 0, p: '-' }, maxS = { val: 0, p: '-' }, maxR = { val: 0, p: '-' }, minRest = { val: 999, p: '-' };

            allRecords.forEach(r => {
                if(r.weight > maxW.val) { maxW.val = r.weight; maxW.p = r.player; }
                if(r.sets > maxS.val) { maxS.val = r.sets; maxS.p = r.player; }
                const total = r.reps * r.sets;
                if(total > maxR.val) { maxR.val = total; maxR.p = r.player; }
                if(r.rest < minRest.val && r.rest > 0) { minRest.val = r.rest; minRest.p = r.player; }
            });

            document.getElementById('rank-weight').innerText = `${maxW.p} (${maxW.val}kg)`;
            document.getElementById('rank-sets').innerText = `${maxS.p} (${maxS.val}組)`;
            document.getElementById('rank-reps').innerText = `${maxR.p} (${maxR.val}次)`;
            document.getElementById('rank-rest').innerText = minRest.val === 999 ? '-' : `${minRest.p} (${minRest.val}s)`;
        }

        function clearHistory() {
            if(confirm("確定清除榜單？這將抹除所有英雄紀錄！")) {
                localStorage.removeItem('gym_ko_records');
                viewAllHistory();
            }
        }

        window.onload = updateLeaderboard;
    </script>
</body>
</html>
